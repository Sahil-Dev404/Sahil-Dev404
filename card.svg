<svg width="760" height="300" viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="photoClip">
      <rect x="24" y="24" width="220" height="252" rx="10"/>
    </clipPath>
    <linearGradient id="borderGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB000"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="760" height="300" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="757" height="297" rx="13" fill="none" stroke="url(#borderGlow)" stroke-width="2"/>

  <!-- fake terminal title bar -->
  <circle cx="20" cy="16" r="5" fill="#FF5F56"/>
  <circle cx="38" cy="16" r="5" fill="#FFBD2E"/>
  <circle cx="56" cy="16" r="5" fill="#27C93F"/>
  <text x="380" y="20" text-anchor="middle" font-family="monospace" font-size="12" fill="#8a8a8a">sahil@devbox: ~</text>

  <!-- photo -->
  <rect x="24" y="24" width="220" height="252" rx="10" fill="#1a1a1a" stroke="#FF8C00" stroke-width="2"/>
  <image href="https://raw.githubusercontent.com/Sahil-Dev404/Sahil-Dev404/main/profile.jpg"
         x="24" y="24" width="220" height="252" clip-path="url(#photoClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- terminal text -->
  <g font-family="monospace" font-size="14" fill="#E0A96D">
    <text x="264" y="52" fill="#FFB000" font-size="16" font-weight="bold">sahil@devbox</text>
    <text x="264" y="70" fill="#5c4324">---------------------</text>

    <text x="264" y="94"><tspan fill="#FF8C00">Name:</tspan>     Sahil Saini</text>
    <text x="264" y="116"><tspan fill="#FF8C00">Role:</tspan>     AI/ML Engineer</text>
    <text x="264" y="138"><tspan fill="#FF8C00">Location:</tspan> New Delhi, India</text>
    <text x="264" y="160"><tspan fill="#FF8C00">Stack:</tspan>    Python, C++</text>
    <text x="264" y="182"><tspan fill="#FF8C00">ML/DL:</tspan>    TensorFlow, Scikit-learn</text>
    <text x="264" y="204"><tspan fill="#FF8C00">Shell:</tspan>    zsh</text>

    <text x="264" y="234" fill="#5c4324">---------------------</text>
    <text x="264" y="256">
      <tspan fill="#FFB000">$</tspan> whoami
    </text>
    <text x="264" y="276" fill="#8a8a8a">&gt; teaching machines to guess better than I do</text>
  </g>
</svg>
